name: Update astros.json

on:
  schedule:
    - cron: '0 */6 * * *' # 每6小时运行一次（UTC）
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write # 允许推送代码

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure target folder exists
        run: |
          mkdir -p docs/frontend-asynchronous-fetch-with-5-solutions/data

      - name: Install jq (if missing)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Fetch remote astros and validate (print & guard)
        run: |
          set -e
          # 抓取（HTTPS 页面不能直接访问 HTTP，但 Actions 可以）
          curl -sSfL "http://api.open-notify.org/astros.json" -o astros.tmp.json

          echo "----- Raw response (first 400 chars) -----"
          head -c 400 astros.tmp.json; echo
          echo "------------------------------------------"

          echo "Summary:"
          jq -r '"message=\(.message)  number=\(.number)  people_count=\(.people|length)"' astros.tmp.json

          # people 必须是数组
          jq -e '.people | type == "array"' astros.tmp.json > /dev/null

          # 非空才覆盖，避免写成 { "people": [] }
          PEOPLE_COUNT=$(jq '.people | length' astros.tmp.json)
          if [ "$PEOPLE_COUNT" -gt 0 ]; then
            mkdir -p docs/frontend-asynchronous-fetch-with-5-solutions/data
            jq . astros.tmp.json > docs/frontend-asynchronous-fetch-with-5-solutions/data/astros.json
            echo "✅ Updated astros.json with ${PEOPLE_COUNT} records."
          else
            echo "::warning:: API returned empty people list. Keep previous astros.json."
          fi

          echo "Files in target dir:"
          ls -lah docs/frontend-asynchronous-fetch-with-5-solutions/data || true

          rm -f astros.tmp.json

      - name: Commit & push if changed
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/frontend-asynchronous-fetch-with-5-solutions/data/astros.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update astros.json (automated)"
          git push
