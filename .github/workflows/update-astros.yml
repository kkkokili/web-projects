name: Update astros.json

on:
  schedule:
    - cron: '0 */6 * * *' # 每6小时运行一次（UTC）
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write # 允许推送代码

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure target folder exists
        run: |
          mkdir -p docs/frontend-asynchronous-fetch-with-5-solutions/data

      - name: Install jq (if missing)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Fetch remote astros and validate
        run: |
          set -e
          curl -sL "http://api.open-notify.org/astros.json" -o astros.tmp.json
          # 校验：必须包含 people 且为数组
          jq -e '.people | arrays' astros.tmp.json >/dev/null
          # 格式化写入到 Pages 路径
          jq . astros.tmp.json > docs/fr
